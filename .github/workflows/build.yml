name: Build iOS Tweak / Dylib

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Compile Dylib
      run: |
        mkdir -p build
        echo "Compiling iOS dylib..."
        
        # Если вы собираете через clang/gcc (пример для теста, чтобы файл появился):
        # clang -dynamiclib -o build/CheatMenu.dylib Assets/Scripts/CheatMenu.cs ...
        
        # Либо если у вас настроен Makefile, просто вызовите:
        # make
        
        # Временная заглушка, чтобы артефакт успешно загрузился и вы проверили скачивание:
        touch build/CheatMenu.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CompiledDylib
        path: |
          build/*.dylib
