name: Build iOS Tweak / Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build Dylib
      run: |
        echo "Building dylib for iOS..."
        # Здесь укажите команды компиляции (например, make, xcodebuild или вызов скрипта с Theos)
        # Пример: make
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CompiledDylib
        path: |
          *.dylib
          build/*.dylib
